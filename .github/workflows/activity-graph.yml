name: Generate Activity Graph

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:        # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - '.github/workflows/activity-graph.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Activity Graph SVG
        run: python scripts/generate_graph.py

      - name: Commit and push graph
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add activity-graph.svg
          git diff --staged --quiet || (git commit -m "chore: update activity graph [skip ci]" && git push)
